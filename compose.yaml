name: clipboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clipboard
      POSTGRES_USER: clipboard
      POSTGRES_PASSWORD: clipboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipboard -d clipboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  clipboard:
    build: .
    environment:
      DATABASE_URL: postgres://clipboard:clipboard@postgres:5432/clipboard?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-local-development-session-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
